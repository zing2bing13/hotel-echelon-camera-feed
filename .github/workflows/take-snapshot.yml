name: Automated UniFi Camera Snapshot

on:
  schedule:
    # This runs the script automatically every hour. Change it using cron syntax if needed.
    - cron: '*/15 * * * *'
  workflow_dispatch: # This allows you to manually click a "Run workflow" button in GitHub

jobs:
  capture-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows GitHub to save the image back to your repo

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download Snapshot from UniFi Protect
        run: |
          # Replace the URL below with your working UniFi snapshot endpoint path
          curl -L -g "https://api.ui.com/v1/connector/consoles/${{ secrets.UNIFI_CONSOLE_ID }}/proxy/protect/integration/v1/cameras/${{secrets.UNIFI_CAMERA_ID}}/snapshot" \
            -H "X-API-Key: ${{ secrets.UNIFI_API_KEY }}" \
            -H "Accept: image/jpeg" \
            -o latest-snapshot.jpg

      - name: Commit and Push Snapshot to Repo
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add latest-snapshot.jpg
          
          # Only commit if the image actually changed to avoid empty errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated snapshot update" && git push)
