<!DOCTYPE html>
<html>
<head>
    <title>Hotel Echelon Live Camera Feed</title>
    <style>
        body { background: #111; text-align: center; color: white; font-family: sans-serif; }
        img { max-width: 90%; border-radius: 8px; margin-top: 50px; }
    </style>
</head>
<body>
    <h2>Hotel Echelon Live Camera Snapshot</h2>
    <!-- The JavaScript query parameter forces the browser to bypass its cache -->
    <img src="latest-snapshot.jpg" id="live-cam" alt="Camera Feed">

    <script>
        setInterval(function() {
            var img = document.getElementById('live-cam');
            img.src = 'latest-snapshot.jpg?v=' + new Date().getTime();
        }, 30000); // Check for an update every 30 seconds
    </script>
</body>
</html>
